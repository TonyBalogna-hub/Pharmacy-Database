<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pharmacy Suppliers</title>
</head>
<body>
    <h1>Pharmacy Suppliers</h1>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Company</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>
        {% for supplier in suppliers %}
        <tr>
            <td>{{ supplier.SupplierID }}</td>
            <td>{{ supplier.CompanyName }}</td>
            <td>{{ supplier.PhoneNumber }}</td>
            <td>{{ supplier.Address }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Add Supplier</h2>
    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
    <form method="post">
        <label>Company: <input name="company" maxlength="100" required></label><br>
        <label>Phone: <input name="phone" maxlength="20" required></label><br>
        <label>Address: <input name="address" maxlength="200" required></label><br>
        <button type="submit">Add Supplier</button>
    </form>
</body>
</html>
