<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pharmacy Suppliers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; font-size: 18px; }
        table { border-collapse: collapse; width: 100%; max-width: 1100px; }
        th, td { border: 1px solid #777; padding: 10px; text-align: left; }
        th { background: #eee; }
        input { padding: 7px; font-size: 17px; margin: 5px 0; }
        button, .button { font: inherit; padding: 6px 12px; cursor: pointer; }
        .actions { white-space: nowrap; }
        .actions form { display: inline; }
        .error { color: #a00000; }
    </style>
</head>
<body>
    <h1>Pharmacy Suppliers</h1>

    <table>
        <tr>
            <th>ID</th><th>Company</th><th>Phone</th><th>Address</th><th>Actions</th>
        </tr>
        {% for supplier in suppliers %}
        <tr>
            <td>{{ supplier.SupplierID }}</td>
            <td>{{ supplier.CompanyName }}</td>
            <td>{{ supplier.PhoneNumber }}</td>
            <td>{{ supplier.Address }}</td>
            <td class="actions">
                <a class="button" href="{{ url_for('edit_supplier', supplier_id=supplier.SupplierID) }}">Edit</a>
                <form method="post" action="{{ url_for('delete_supplier', supplier_id=supplier.SupplierID) }}"
                      onsubmit="return confirm('Delete this supplier?');">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <h2>Add Supplier</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('suppliers') }}">
        <label>Company: <input name="company" maxlength="100" required></label><br>
        <label>Phone: <input name="phone" maxlength="20" required></label><br>
        <label>Address: <input name="address" maxlength="200" required></label><br>
        <button type="submit">Add Supplier</button>
    </form>
</body>
</html>
