<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Supplier</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; font-size: 18px; }
        input { padding: 7px; font-size: 17px; margin: 5px 0; width: 360px; max-width: 90%; }
        button { padding: 7px 14px; font-size: 18px; cursor: pointer; }
        .error { color: #a00000; }
    </style>
</head>
<body>
    <h1>Edit Supplier</h1>
    <p>Editing supplier #{{ supplier.SupplierID }}</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>Company: <input name="company" maxlength="100" value="{{ supplier.CompanyName }}" required></label><br>
        <label>Phone: <input name="phone" maxlength="20" value="{{ supplier.PhoneNumber }}" required></label><br>
        <label>Address: <input name="address" maxlength="200" value="{{ supplier.Address }}" required></label><br>
        <button type="submit">Save Changes</button>
        <a href="{{ url_for('suppliers') }}">Cancel</a>
    </form>
</body>
</html>
