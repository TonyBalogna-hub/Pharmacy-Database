<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Medication Inventory</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>Pharmacy Medication Inventory</h1>

    <p>Current medications and quantities in stock.</p>

    <table>
        <tr>
            <th>Medication ID</th>
            <th>Medication Name</th>
            <th>Dosage</th>
            <th>Quantity in Stock</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Amoxicillin</td>
            <td>500 mg</td>
            <td>90</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ibuprofen</td>
            <td>600 mg</td>
            <td>60</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Acetaminophen</td>
            <td>325 mg</td>
            <td>120</td>
        </tr>
    </table>
</body>
</html>
